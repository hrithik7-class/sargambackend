services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sargam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sargamdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sargam-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: sargam-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sargam-network

  # Backend API — instance 1 (load balanced)
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sargam-api-1
    restart: unless-stopped
    ports:
      - "8000:8000"  # Direct access for dev/debug when Nginx not used
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0  # Override: .env has localhost, containers use Docker hostname
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - media_tracks:/app/media/tracks
    networks:
      - sargam-network

  # Backend API — instance 2 (load balanced)
  api2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sargam-api-2
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - media_tracks:/app/media/tracks
    networks:
      - sargam-network

  # Backend API — instance 3 (load balanced)
  api3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sargam-api-3
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - media_tracks:/app/media/tracks
    networks:
      - sargam-network

  # Nginx — reverse proxy + load balancer (all requests go through Nginx first)
  nginx:
    image: nginx:alpine
    container_name: sargam-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - sargam-network

volumes:
  postgres_data:
  redis_data:
  nginx_ssl:
  media_tracks:

networks:
  sargam-network:
    driver: bridge
